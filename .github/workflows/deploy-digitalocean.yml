name: Deploy Production (DigitalOcean)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: gigflow-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gigflow
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gigflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gigflow
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-jwt-secret-minimum-24-characters-long
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:api
      - run: npm run build --workspace @gigflow/admin
      - run: npm run typecheck --workspace @gigflow/mobile

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_SSH_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/gigflow
            chmod +x deploy/digitalocean/scripts/*.sh
            ./deploy/digitalocean/scripts/deploy.sh
      - name: Smoke test API
        run: |
          curl -fsS "https://${{ secrets.API_DOMAIN }}/health" | grep -q '"ok":true'
          curl -fsS "https://${{ secrets.API_DOMAIN }}/ready" | grep -q '"ready":true'
