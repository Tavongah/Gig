# PostgreSQL 16 — production tuning for a 4GB Droplet (adjust shared_buffers if RAM differs)
listen_addresses = '*'
port = 5432
max_connections = 100
shared_buffers = 256MB
effective_cache_size = 768MB
maintenance_work_mem = 64MB
work_mem = 8MB
wal_buffers = 16MB
checkpoint_completion_target = 0.9
random_page_cost = 1.1
effective_io_concurrency = 200
min_wal_size = 256MB
max_wal_size = 1GB
log_timezone = 'UTC'
timezone = 'UTC'
log_min_duration_statement = 500
log_connections = on
log_disconnections = on
log_line_prefix = '%t [%p]: user=%u,db=%d,app=%a,client=%h '

# Connection pooling hint: API uses Prisma; for high scale add PgBouncer in front
# See deploy/digitalocean/DIGITALOCEAN_DEPLOY.md scaling section
