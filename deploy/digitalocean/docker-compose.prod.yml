# DUTS production stack — single DigitalOcean Droplet (launch tier, ~$35–45/mo).
# Usage (on server): docker compose --env-file /opt/gigflow/.env.production -f deploy/digitalocean/docker-compose.prod.yml up -d

name: gigflow

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gigflow}
      POSTGRES_USER: ${POSTGRES_USER:-gigflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./backups:/backups
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gigflow} -d ${POSTGRES_DB:-gigflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - redis_data:/data
      - ../redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - ${GIGFLOW_ENV_FILE:-/opt/gigflow/.env.production}
    environment:
      NODE_ENV: production
      TRUST_PROXY: "true"
      DATABASE_URL: postgresql://${POSTGRES_USER:-gigflow}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-gigflow}?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "4000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"

  nginx:
    build:
      context: ../..
      dockerfile: deploy/nginx/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-https://api.example.com/v1}
        EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-https://api.example.com/v1}
        EXPO_PUBLIC_WEB_URL: ${MOBILE_PUBLIC_URL:-https://app.example.com}
        EXPO_PUBLIC_SUPPORT_EMAIL: ${EXPO_PUBLIC_SUPPORT_EMAIL:-info@duts.tech}
        EXPO_PUBLIC_SUPPORT_PHONE: ${EXPO_PUBLIC_SUPPORT_PHONE:-}
        EXPO_PUBLIC_FIREBASE_API_KEY: ${EXPO_PUBLIC_FIREBASE_API_KEY:-}
        EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN:-}
        EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${EXPO_PUBLIC_FIREBASE_PROJECT_ID:-}
        EXPO_PUBLIC_FIREBASE_APP_ID: ${EXPO_PUBLIC_FIREBASE_APP_ID:-}
        PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-https://www.duts.tech}
        PUBLIC_APP_URL: ${PUBLIC_APP_URL:-https://app.duts.tech}
        PUBLIC_SUPPORT_EMAIL: ${PUBLIC_SUPPORT_EMAIL:-info@duts.tech}
        PUBLIC_SUPPORT_PHONE: ${PUBLIC_SUPPORT_PHONE:-}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/conf.d:/etc/nginx/conf.d:ro
      - ../nginx/snippets:/etc/nginx/snippets:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      api:
        condition: service_started
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  certbot:
    image: certbot/certbot:latest
    profiles: ["certbot"]
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

  certbot-once:
    image: certbot/certbot:latest
    profiles: ["tools"]
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: ["certbot"]

volumes:
  postgres_data:
  redis_data:
  certbot_conf:
  certbot_www:

networks:
  internal:
    driver: bridge
