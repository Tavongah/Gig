# Firebase Auth helper endpoints (handler, iframe, callback).
# Customer URL stays on APP_DOMAIN; upstream Host is the immutable Firebase Hosting origin.
# Do not try_files these paths — that would serve the Expo SPA instead of the auth helper.
proxy_http_version 1.1;
proxy_ssl_server_name on;
proxy_ssl_name $firebase_auth_backend;
proxy_set_header Host $firebase_auth_backend;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_redirect off;
proxy_buffering off;
proxy_read_timeout 60s;
proxy_send_timeout 60s;
