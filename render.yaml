# GIGFLOW — Render Blueprint
# Dashboard → New → Blueprint → connect GitHub repo (root = this folder)

services:
  - type: web
    name: gigflow-api
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: RUN_SEED
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: gigflow-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: gigflow-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: API_PUBLIC_URL
        sync: false
      - key: MOBILE_PUBLIC_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_CONNECT_CLIENT_ID
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: ADMIN_SEED_PASSWORD
        sync: false
      - key: LOG_VERIFICATION_TO_CONSOLE
        sync: false

  - type: keyvalue
    name: gigflow-redis
    plan: free
    ipAllowList: []

  - type: web
    name: gigflow-admin
    runtime: static
    plan: free
    branch: main
    buildCommand: npm ci && npm run build --workspace @gigflow/admin
    staticPublishPath: apps/admin/dist
    envVars:
      - key: VITE_API_URL
        sync: false

databases:
  - name: gigflow-db
    plan: free
